name: Build & Publish .NET Package

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '.github/workflows/*.yml'

env:
  DOTNET_VERSION: '11.0.x'
  PACKAGE_VERSION: 11.0.0

jobs:
  build:

    runs-on: ubuntu-latest
    environment: global
    permissions:
      id-token: write

    steps:
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Checkout
      id: checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET Core
      id: setup-dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install dependencies
      id: dotnet-restore
      run: dotnet restore Build.Puffix.Exceptions.slnx

    - name: Build
      id: dotnet-build
      run: dotnet build Build.Puffix.Exceptions.slnx --configuration Release --no-restore

    - name: Test
      id: dotnet-test
      run: dotnet test Build.Puffix.Exceptions.slnx --no-restore --verbosity normal

    - name: Publish Nuget Package
      id: dotnet-nuget-push
      run: dotnet nuget push /home/runner/work/Puffix.Exceptions/Puffix.Exceptions/Puffix.Exceptions/bin/Release/Puffix.Exceptions.${{ env.PACKAGE_VERSION }}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate